name: Проверка игровой логики
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: S00–S08 / бюджет / переходы
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Проверить доступность Node
        run: node --version
      - name: Запустить автономные проверки
        run: node tests/smoke.test.js
